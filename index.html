<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Make Me Laugh</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#09090c;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

.app{
  width:min(720px,100%);
  margin:auto;
  padding:18px 14px 35px;
}

.camera{
  position:relative;
  width:100%;
  aspect-ratio:9/12;
  background:#15151a;
  border-radius:28px;
  overflow:hidden;
  box-shadow:0 12px 40px rgba(0,0,0,.45);
}

#video{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
  display:block;
}

#overlay{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  transform:scaleX(-1);
}

.cameraText{
  position:absolute;
  left:0;
  right:0;
  bottom:105px;
  text-align:center;
  pointer-events:none;
}

.cameraText .small{
  font-size:16px;
  font-weight:800;
  letter-spacing:4px;
  opacity:.65;
  text-shadow:0 2px 8px #000;
}

.cameraText .big{
  margin-top:8px;
  font-size:29px;
  line-height:1.05;
  font-weight:900;
  text-shadow:0 3px 10px #000;
}

h2{
  font-size:19px;
  margin:25px 0 12px;
}

.chips{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:4px;
  scrollbar-width:none;
}

.chips::-webkit-scrollbar{
  display:none;
}

.chip{
  flex:0 0 auto;
  border:0;
  border-radius:18px;
  padding:15px 20px;
  background:#29272e;
  color:white;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
}

.chip.on{
  background:#ff2d5d;
}

input{
  width:100%;
  margin-top:12px;
  padding:18px;
  border-radius:18px;
  border:1px solid #45434b;
  background:#111114;
  color:white;
  font-size:16px;
  outline:none;
}

input::placeholder{
  color:#77757d;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:14px;
}

.btn{
  border:0;
  border-radius:18px;
  padding:17px 10px;
  background:#29272e;
  color:white;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
}

.btn.primary{
  background:#ff2d5d;
}

.btn:active{
  transform:scale(.98);
}

.status{
  text-align:center;
  margin:18px 0;
  color:#aaa8b0;
  min-height:24px;
}

.card{
  background:#15151a;
  border:1px solid #29282e;
  border-radius:22px;
  padding:22px;
  margin-top:18px;
}

.card strong{
  font-size:17px;
}

.card p{
  color:#ddd;
  line-height:1.5;
  margin-bottom:0;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<div class="app">

  <div class="camera">

    <video id="video" autoplay muted playsinline></video>

    <canvas id="overlay"></canvas>

    <div class="cameraText">
      <div class="small">AI TRANSFORMATION</div>
      <div class="big" id="phrase">
        Give them a huge moustache
      </div>
    </div>

  </div>

  <h2>What do you want to do to them?</h2>

  <div class="chips">

    <button class="chip on" data-effect="moustache">
      🥸 Moustache
    </button>

    <button class="chip" data-effect="hat">
      🎩 Red hat
    </button>

    <button class="chip" data-effect="ears">
      👂 Big ears
    </button>

    <button class="chip" data-effect="beard">
      🧔 Beard
    </button>

    <button class="chip" data-effect="hair">
      💇 Hair
    </button>

  </div>

  <input
    id="custom"
    type="text"
    placeholder='Or type "Give Dad a massive beard"'
  >

  <div class="buttons">

    <button class="btn primary" id="transform">
      ✨ TRANSFORM
    </button>

    <button class="btn" id="start">
      📷 START CAMERA
    </button>

    <button class="btn" id="swap">
      ↔ SWAP
    </button>

    <button class="btn" id="laugh">
      😂 THEY LAUGHED
    </button>

  </div>

  <div class="status" id="status">
    Camera ready — press START CAMERA
  </div>

  <div class="card">
    <strong>FIRST PERSON TO LAUGH LOSES</strong>
    <p>
      Make your opponent laugh by changing their face with
      ridiculous live effects.
    </p>
  </div>

</div>


<script type="module">

/* =========================================================
   MEDIAPIPE
========================================================= */

import {
  FaceLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs";


/* =========================================================
   ELEMENTS
========================================================= */

const video = document.getElementById("video");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");

const status = document.getElementById("status");
const phrase = document.getElementById("phrase");
const custom = document.getElementById("custom");

const transformButton = document.getElementById("transform");
const startButton = document.getElementById("start");
const swapButton = document.getElementById("swap");
const laughButton = document.getElementById("laugh");

let faceLandmarker = null;
let stream = null;

let active = false;
let currentEffect = "moustache";
let player = "A";
let round = 1;

let lastVideoTime = -1;


/* =========================================================
   EFFECT WORDS
========================================================= */

function chooseEffect(text){

  const t = text.toLowerCase();

  if(
    t.includes("moustache") ||
    t.includes("mustache") ||
    t.includes("mo") ||
    t.includes("stache")
  ){
    return "moustache";
  }

  if(
    t.includes("red hat") ||
    t.includes("hat") ||
    t.includes("top hat") ||
    t.includes("cap")
  ){
    return "hat";
  }

  if(
    t.includes("big ear") ||
    t.includes("huge ear") ||
    t.includes("ears")
  ){
    return "ears";
  }

  if(
    t.includes("beard") ||
    t.includes("massive beard") ||
    t.includes("big beard")
  ){
    return "beard";
  }

  if(
    t.includes("hair") ||
    t.includes("long hair") ||
    t.includes("big hair")
  ){
    return "hair";
  }

  return currentEffect;
}


/* =========================================================
   CAMERA
========================================================= */

async function startCamera(){

  try{

    status.textContent = "Starting camera...";

    if(!faceLandmarker){

      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm"
      );

      faceLandmarker =
        await FaceLandmarker.createFromOptions(
          vision,
          {
            baseOptions:{
              modelAssetPath:
                "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
              delegate:"GPU"
            },

            runningMode:"VIDEO",

            numFaces:2,

            minFaceDetectionConfidence:.5,
            minFacePresenceConfidence:.5,
            minTrackingConfidence:.5
          }
        );
    }


    if(!stream){

      stream = await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:"user",
          width:{ideal:1280},
          height:{ideal:1280}
        },
        audio:false
      });

      video.srcObject = stream;
    }


    await video.play();

    active = true;

    resizeCanvas();

    status.textContent =
      "📷 Camera live — make them laugh!";

    requestAnimationFrame(loop);

  }catch(error){

    console.error(error);

    status.textContent =
      "Camera error: " +
      error.name +
      " — " +
      error.message;
  }
}


/* =========================================================
   CANVAS
========================================================= */

function resizeCanvas(){

  const ratio = window.devicePixelRatio || 1;

  canvas.width = video.clientWidth * ratio;
  canvas.height = video.clientHeight * ratio;

  canvas.style.width = video.clientWidth + "px";
  canvas.style.height = video.clientHeight + "px";

  ctx.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0
  );
}


/* =========================================================
   LANDMARK HELPERS
========================================================= */

function point(lm,i,w,h){

  return {
    x:lm[i].x*w,
    y:lm[i].y*h
  };
}


function distance(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );
}


function angle(a,b){

  return Math.atan2(
    b.y-a.y,
    b.x-a.x
  );
}


/* =========================================================
   REALISTIC MUSTACHE
========================================================= */

function drawMoustache(lm,w,h){

  /*
    MediaPipe landmarks:

    13 = upper lip centre
    61 = left mouth corner
    291 = right mouth corner

    The moustache is positioned ABOVE the upper lip,
    rather than directly over the mouth.
  */

  const mouth = point(lm,13,w,h);
  const left = point(lm,61,w,h);
  const right = point(lm,291,w,h);

  const width = distance(left,right);

  const centreX = (left.x + right.x) / 2;

  const centreY =
    mouth.y -
    width * 0.16;

  const moustacheWidth =
    width * 1.05;

  const moustacheHeight =
    width * 0.34;

  const rot = angle(left,right);


  ctx.save();

  ctx.translate(
    centreX,
    centreY
  );

  ctx.rotate(rot);


  /*
    Soft shadow underneath.
  */

  ctx.shadowColor =
    "rgba(0,0,0,.55)";

  ctx.shadowBlur =
    Math.max(3,width*.06);

  ctx.shadowOffsetY =
    width*.025;


  /*
    Dark brown gradient gives it
    a more natural hair appearance.
  */

  const gradient =
    ctx.createLinearGradient(
      0,
      -moustacheHeight,
      0,
      moustacheHeight
    );

  gradient.addColorStop(
    0,
    "#25150f"
  );

  gradient.addColorStop(
    .45,
    "#120b08"
  );

  gradient.addColorStop(
    1,
    "#050403"
  );


  ctx.fillStyle = gradient;


  /*
    LEFT HALF
  */

  ctx.beginPath();

  ctx.moveTo(
    -moustacheWidth*.04,
    -moustacheHeight*.03
  );

  ctx.bezierCurveTo(
    -moustacheWidth*.20,
    -moustacheHeight*.30,
    -moustacheWidth*.43,
    -moustacheHeight*.40,
    -moustacheWidth*.50,
    -moustacheHeight*.05
  );

  ctx.bezierCurveTo(
    -moustacheWidth*.42,
    moustacheHeight*.42,
    -moustacheWidth*.15,
    moustacheHeight*.32,
    0,
    moustacheHeight*.05
  );

  ctx.closePath();

  ctx.fill();


  /*
    RIGHT HALF
  */

  ctx.beginPath();

  ctx.moveTo(
    moustacheWidth*.04,
    -moustacheHeight*.03
  );

  ctx.bezierCurveTo(
    moustacheWidth*.20,
    -moustacheHeight*.30,
    moustacheWidth*.43,
    -moustacheHeight*.40,
    moustacheWidth*.50,
    -moustacheHeight*.05
  );

  ctx.bezierCurveTo(
    moustacheWidth*.42,
    moustacheHeight*.42,
    moustacheWidth*.15,
    moustacheHeight*.32,
    0,
    moustacheHeight*.05
  );

  ctx.closePath();

  ctx.fill();


  /*
    Individual hair strokes.
  */

  ctx.shadowColor = "transparent";

  ctx.lineWidth =
    Math.max(1,width*.012);

  ctx.lineCap = "round";

  ctx.strokeStyle =
    "rgba(90,55,38,.65)";


  for(let i=0;i<16;i++){

    const side =
      i < 8 ? -1 : 1;

    const n =
      i % 8;

    const startX =
      side *
      moustacheWidth *
      (.06 + n*.045);

    ctx.beginPath();

    ctx.moveTo(
      startX,
      moustacheHeight*.10
    );

    ctx.quadraticCurveTo(
      startX + side*moustacheWidth*.04,
      -moustacheHeight*.08,
      startX + side*moustacheWidth*.08,
      -moustacheHeight*.23
    );

    ctx.stroke();
  }

  ctx.restore();
}


/* =========================================================
   REALISTIC BEARD
========================================================= */

function drawBeard(lm,w,h){

  const leftJaw = point(lm,172,w,h);
  const rightJaw = point(lm,397,w,h);

  const chin = point(lm,152,w,h);
  const mouth = point(lm,13,w,h);

  const jawWidth =
    distance(leftJaw,rightJaw);

  ctx.save();

  ctx.fillStyle =
    "rgba(18,12,9,.78)";

  ctx.shadowColor =
    "rgba(0,0,0,.4)";

  ctx.shadowBlur =
    jawWidth*.04;


  ctx.beginPath();

  ctx.moveTo(
    leftJaw.x,
    leftJaw.y-jawWidth*.05
  );

  ctx.quadraticCurveTo(
    mouth.x-jawWidth*.35,
    mouth.y+jawWidth*.22,
    chin.x,
    chin.y+jawWidth*.10
  );

  ctx.quadraticCurveTo(
    mouth.x+jawWidth*.35,
    mouth.y+jawWidth*.22,
    rightJaw.x,
    rightJaw.y-jawWidth*.05
  );

  ctx.quadraticCurveTo(
    mouth.x+jawWidth*.32,
    mouth.y-jawWidth*.04,
    mouth.x,
    mouth.y-jawWidth*.08
  );

  ctx.quadraticCurveTo(
    mouth.x-jawWidth*.32,
    mouth.y-jawWidth*.04,
    leftJaw.x,
    leftJaw.y-jawWidth*.05
  );

  ctx.closePath();

  ctx.fill();

  ctx.restore();
}


/* =========================================================
   REALISTIC HAT
========================================================= */

function drawHat(lm,w,h){

  const forehead = point(lm,10,w,h);

  const left = point(lm,234,w,h);
  const right = point(lm,454,w,h);

  const headWidth =
    distance(left,right);

  const hatWidth =
    headWidth*.82;

  const hatHeight =
    headWidth*.58;

  ctx.save();

  ctx.translate(
    forehead.x,
    forehead.y-headWidth*.36
  );


  /*
    Hat shadow
  */

  ctx.shadowColor =
    "rgba(0,0,0,.55)";

  ctx.shadowBlur =
    headWidth*.08;


  /*
    Red top
  */

  const red =
    ctx.createLinearGradient(
      0,
      -hatHeight,
      0,
      0
    );

  red.addColorStop(
    0,
    "#ff3b3b"
  );

  red.addColorStop(
    .55,
    "#b80000"
  );

  red.addColorStop(
    1,
    "#650000"
  );

  ctx.fillStyle = red;

  ctx.beginPath();

  ctx.roundRect(
    -hatWidth*.28,
    -hatHeight*.48,
    hatWidth*.56,
    hatHeight*.48,
    hatWidth*.08
  );

  ctx.fill();


  /*
    Black band
  */

  ctx.fillStyle =
    "#111";

  ctx.fillRect(
    -hatWidth*.29,
    -hatHeight*.12,
    hatWidth*.58,
    hatHeight*.10
  );


  /*
    Brim
  */

  ctx.fillStyle =
    "#170000";

  ctx.beginPath();

  ctx.ellipse(
    0,
    0,
    hatWidth*.52,
    hatWidth*.12,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.restore();
}


/* =========================================================
   BIG EARS
========================================================= */

function drawEars(lm,w,h){

  const left = point(lm,234,w,h);
  const right = point(lm,454,w,h);

  const faceWidth =
    distance(left,right);

  const earSize =
    faceWidth*.28;


  ctx.save();

  ctx.fillStyle =
    "rgba(225,155,145,.95)";

  ctx.strokeStyle =
    "rgba(115,65,60,.8)";

  ctx.lineWidth =
    faceWidth*.025;


  function ear(x,y,side){

    ctx.beginPath();

    ctx.ellipse(
      x + side*faceWidth*.10,
      y,
      earSize*.45,
      earSize*.72,
      side*.15,
      0,
      Math.PI*2
    );

    ctx.fill();
    ctx.stroke();


    ctx.strokeStyle =
      "rgba(130,70,65,.65)";

    ctx.lineWidth =
      faceWidth*.018;

    ctx.beginPath();

    ctx.arc(
      x + side*faceWidth*.10,
      y,
      earSize*.25,
      0,
      Math.PI*1.5
    );

    ctx.stroke();
  }


  ear(left.x,left.y,-1);
  ear(right.x,right.y,1);

  ctx.restore();
}


/* =========================================================
   HAIR
========================================================= */

function drawHair(lm,w,h){

  const top = point(lm,10,w,h);

  const left = point(lm,234,w,h);
  const right = point(lm,454,w,h);

  const headWidth =
    distance(left,right);

  const hairWidth =
    headWidth*.76;

  const hairHeight =
    headWidth*.25;


  ctx.save();

  ctx.translate(
    top.x,
    top.y-headWidth*.08
  );

  ctx.fillStyle =
    "#16100c";

  ctx.shadowColor =
    "rgba(0,0,0,.5)";

  ctx.shadowBlur =
    headWidth*.04;


  ctx.beginPath();

  ctx.moveTo(
    -hairWidth*.50,
    hairHeight*.40
  );

  ctx.quadraticCurveTo(
    -hairWidth*.45,
    -hairHeight*.50,
    -hairWidth*.05,
    -hairHeight*.70
  );

  ctx.quadraticCurveTo(
    hairWidth*.35,
    -hairHeight*.75,
    hairWidth*.50,
    hairHeight*.35
  );

  ctx.quadraticCurveTo(
    0,
    hairHeight*.05,
    -hairWidth*.50,
    hairHeight*.40
  );

  ctx.closePath();

  ctx.fill();


  /*
    Hair strands
  */

  ctx.shadowColor="transparent";

  ctx.strokeStyle =
    "rgba(80,55,40,.7)";

  ctx.lineWidth =
    Math.max(1,headWidth*.012);

  for(let i=0;i<14;i++){

    const x =
      -hairWidth*.4 +
      i*(hairWidth*.8/13);

    ctx.beginPath();

    ctx.moveTo(
      x,
      hairHeight*.25
    );

    ctx.quadraticCurveTo(
      x-.03*hairWidth,
      -hairHeight*.30,
      x+.02*hairWidth,
      -hairHeight*.60
    );

    ctx.stroke();
  }

  ctx.restore();
}


/* =========================================================
   DRAW FACE EFFECT
========================================================= */

function drawFace(lm,w,h){

  if(currentEffect==="moustache"){
    drawMoustache(lm,w,h);
  }

  if(currentEffect==="beard"){
    drawBeard(lm,w,h);
  }

  if(currentEffect==="hat"){
    drawHat(lm,w,h);
  }

  if(currentEffect==="ears"){
    drawEars(lm,w,h);
  }

  if(currentEffect==="hair"){
    drawHair(lm,w,h);
  }
}


/* =========================================================
   MAIN LOOP
========================================================= */

function loop(){

  if(!active){
    return;
  }

  const w = video.clientWidth;
  const h = video.clientHeight;

  if(
    video.readyState >= 2 &&
    video.currentTime !== lastVideoTime
  ){

    const result =
      faceLandmarker.detectForVideo(
        video,
        performance.now()
      );


    ctx.clearRect(
      0,
      0,
      w,
      h
    );


    /*
      Draw every detected face.
      This allows two people to appear
      in the camera at the same time.
    */

    if(result.faceLandmarks){

      result.faceLandmarks.forEach(
        lm => drawFace(lm,w,h)
      );
    }


    lastVideoTime =
      video.currentTime;
  }


  requestAnimationFrame(loop);
}


/* =========================================================
   EFFECT BUTTONS
========================================================= */

document
  .querySelectorAll(".chip")
  .forEach(button=>{

    button.onclick=()=>{

      document
        .querySelectorAll(".chip")
        .forEach(x=>
          x.classList.remove("on")
        );

      button.classList.add("on");

      currentEffect =
        button.dataset.effect;

      const names={
        moustache:"Give them a huge realistic moustache",
        hat:"Put a realistic red hat on them",
        ears:"Give them huge realistic ears",
        beard:"Give them a huge realistic beard",
        hair:"Give them ridiculous realistic hair"
      };

      phrase.textContent =
        names[currentEffect];
    };
  });


/* =========================================================
   TRANSFORM
========================================================= */

transformButton.onclick=()=>{

  const text =
    custom.value.trim();

  if(text){

    currentEffect =
      chooseEffect(text);

    phrase.textContent =
      text;

    document
      .querySelectorAll(".chip")
      .forEach(x=>{
        x.classList.toggle(
          "on",
          x.dataset.effect===currentEffect
        );
      });

  }else{

    phrase.textContent =
      "Give them a huge realistic " +
      currentEffect;
  }

  status.textContent =
    "✨ Transformation ready!";
};


/* =========================================================
   START CAMERA
========================================================= */

startButton.onclick=()=>{
  startCamera();
};


/* =========================================================
   SWAP
========================================================= */

swapButton.onclick=()=>{

  player =
    player==="A" ? "B" : "A";

  round++;

  status.textContent =
    "🔄 Player " +
    player +
    " is now attacking!";

};


/* =========================================================
   LAUGH
========================================================= */

laughButton.onclick=()=>{

  status.textContent =
    "😂 Player " +
    player +
    " laughed!";

  player =
    player==="A" ? "B" : "A";

  round++;
};


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  resizeCanvas
);


/* =========================================================
   GLOBAL ERRORS
========================================================= */

window.addEventListener(
  "error",
  e=>{
    status.textContent =
      "JS ERROR: " +
      e.message;
  }
);

window.addEventListener(
  "unhandledrejection",
  e=>{
    status.textContent =
      "JS ERROR: " +
      e.reason;
  }
);

</script>

</body>
</html>
