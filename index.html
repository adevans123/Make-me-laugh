<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Make Me Laugh</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #09090b;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
}

.app {
  width: min(720px, 100%);
  margin: auto;
  padding: 16px 14px 40px;
}

.camera {
  position: relative;
  width: 100%;
  aspect-ratio: 9 / 12;
  background: #15151a;
  border-radius: 28px;
  overflow: hidden;
  box-shadow: 0 12px 40px rgba(0,0,0,.45);
}

#video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
}

#overlay {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  transform: scaleX(-1);
  pointer-events: none;
}

.cameraText {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 105px;
  text-align: center;
  pointer-events: none;
  z-index: 5;
  text-shadow: 0 2px 8px #000;
}

.cameraText .small {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 4px;
  opacity: .65;
}

.cameraText .big {
  margin-top: 8px;
  font-size: clamp(25px, 6vw, 38px);
  line-height: 1.05;
  font-weight: 900;
}

h2 {
  font-size: 20px;
  margin: 22px 0 12px;
}

.chips {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 4px;
}

.chip {
  border: 0;
  background: #29272e;
  color: white;
  padding: 15px 20px;
  border-radius: 30px;
  font-size: 17px;
  font-weight: 800;
  white-space: nowrap;
}

.chip.active {
  background: #ff2856;
}

input {
  width: 100%;
  margin-top: 14px;
  padding: 20px;
  border-radius: 24px;
  border: 1px solid #3a383e;
  background: #111114;
  color: white;
  font-size: 17px;
  outline: none;
}

input::placeholder {
  color: #85838a;
}

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 14px;
}

.btn {
  border: 0;
  border-radius: 24px;
  padding: 20px 12px;
  background: #29272e;
  color: white;
  font-size: 17px;
  font-weight: 900;
}

.btn.primary {
  background: #ff2856;
}

.status {
  text-align: center;
  margin: 14px 0;
  color: #aaa;
  min-height: 22px;
}

.card {
  background: #151419;
  border: 1px solid #29272e;
  border-radius: 25px;
  padding: 22px;
  margin-top: 12px;
}

.card strong {
  font-size: 18px;
}

.card p {
  line-height: 1.5;
  color: #ddd;
}
</style>
</head>

<body>

<div class="app">

  <div class="camera">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>

    <div class="cameraText">
      <div class="small">AI TRANSFORMATION</div>
      <div class="big" id="phrase">
        Give them a huge realistic beard
      </div>
    </div>
  </div>

  <h2>What do you want to do to them?</h2>

  <div class="chips">

    <button class="chip" data-effect="moustache">
      😎 Moustache
    </button>

    <button class="chip" data-effect="hat">
      🎩 Hat
    </button>

    <button class="chip" data-effect="ears">
      👂 Big ears
    </button>

    <button class="chip active" data-effect="beard">
      🧔 Beard
    </button>

    <button class="chip" data-effect="hair">
      💇 Hair
    </button>

    <button class="chip" data-effect="glasses">
      🕶️ Glasses
    </button>

  </div>

  <input
    id="custom"
    type="text"
    placeholder='Or type "Give Dad a massive beard"'
  >

  <div class="buttons">

    <button class="btn primary" id="transform">
      ✨ TRANSFORM
    </button>

    <button class="btn" id="start">
      📸 START CAMERA
    </button>

    <button class="btn" id="swap">
      ↔ SWAP
    </button>

    <button class="btn" id="laugh">
      😂 THEY LAUGHED
    </button>

  </div>

  <div class="status" id="status">
    Camera ready — press START CAMERA
  </div>

  <div class="card">
    <strong>FIRST PERSON TO LAUGH LOSES</strong>
    <p>
      Make your opponent laugh by changing their face
      with ridiculous live effects.
    </p>
  </div>

</div>

<script type="module">

import {
  FaceLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs";

const video = document.getElementById("video");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");

const status = document.getElementById("status");
const phrase = document.getElementById("phrase");
const custom = document.getElementById("custom");

const startButton = document.getElementById("start");
const transformButton = document.getElementById("transform");
const swapButton = document.getElementById("swap");
const laughButton = document.getElementById("laugh");

let faceLandmarker = null;
let stream = null;
let running = false;
let currentEffect = "beard";
let player = "A";
let lastVideoTime = -1;

/* ---------------------------------------------------
   MEDIAPIPE SETUP
--------------------------------------------------- */

async function setupFaceTracking() {

  status.textContent = "Loading face tracking...";

  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm"
  );

  faceLandmarker = await FaceLandmarker.createFromOptions(
    vision,
    {
      baseOptions: {
        modelAssetPath:
          "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        delegate: "GPU"
      },

      runningMode: "VIDEO",

      numFaces: 2,

      minFaceDetectionConfidence: 0.5,
      minFacePresenceConfidence: 0.5,
      minTrackingConfidence: 0.5,

      outputFaceBlendshapes: false,
      outputFacialTransformationMatrixes: false
    }
  );

  status.textContent = "Face tracking ready";
}


/* ---------------------------------------------------
   CAMERA
--------------------------------------------------- */

async function startCamera() {

  try {

    if (!faceLandmarker) {
      await setupFaceTracking();
    }

    if (stream) {
      stream.getTracks().forEach(track => track.stop());
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user",
        width: { ideal: 1280 },
        height: { ideal: 1280 }
      },
      audio: false
    });

    video.srcObject = stream;

    await video.play();

    resizeCanvas();

    running = true;

    status.textContent =
      "📸 Camera live — move your face around!";

    requestAnimationFrame(loop);

  } catch (error) {

    console.error(error);

    status.textContent =
      "Camera error: " +
      error.name +
      " — " +
      error.message;
  }
}


/* ---------------------------------------------------
   CANVAS
--------------------------------------------------- */

function resizeCanvas() {

  const dpr = window.devicePixelRatio || 1;

  canvas.width = video.clientWidth * dpr;
  canvas.height = video.clientHeight * dpr;

  canvas.style.width = video.clientWidth + "px";
  canvas.style.height = video.clientHeight + "px";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );
}


/* ---------------------------------------------------
   LANDMARK HELPERS
--------------------------------------------------- */

function point(landmarks, index, w, h) {

  return {
    x: landmarks[index].x * w,
    y: landmarks[index].y * h
  };
}


function distance(a, b) {

  return Math.hypot(
    b.x - a.x,
    b.y - a.y
  );
}


function angle(a, b) {

  return Math.atan2(
    b.y - a.y,
    b.x - a.x
  );
}


/* ---------------------------------------------------
   REALISTIC DRAWING HELPERS
--------------------------------------------------- */

function roundedRect(ctx, x, y, w, h, r) {

  ctx.beginPath();

  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);

  ctx.quadraticCurveTo(
    x + w,
    y,
    x + w,
    y + r
  );

  ctx.lineTo(x + w, y + h - r);

  ctx.quadraticCurveTo(
    x + w,
    y + h,
    x + w - r,
    y + h
  );

  ctx.lineTo(x + r, y + h);

  ctx.quadraticCurveTo(
    x,
    y + h,
    x,
    y + h - r
  );

  ctx.lineTo(x, y + r);

  ctx.quadraticCurveTo(
    x,
    y,
    x + r,
    y
  );

  ctx.closePath();
}


/* ---------------------------------------------------
   REALISTIC MOUSTACHE
--------------------------------------------------- */

function drawMoustache(lm, w, h) {

  const left = point(lm, 61, w, h);
  const right = point(lm, 291, w, h);
  const centre = point(lm, 13, w, h);

  const width = distance(left, right);
  const rot = angle(left, right);

  ctx.save();

  ctx.translate(
    centre.x,
    centre.y - width * 0.03
  );

  ctx.rotate(rot);

  const mw = width * 0.82;
  const mh = width * 0.23;

  const gradient = ctx.createLinearGradient(
    0,
    -mh,
    0,
    mh
  );

  gradient.addColorStop(0, "#211914");
  gradient.addColorStop(.5, "#080706");
  gradient.addColorStop(1, "#3a2920");

  ctx.fillStyle = gradient;

  /* left side */

  ctx.beginPath();

  ctx.moveTo(0, 0);

  ctx.bezierCurveTo(
    -mw * .15,
    -mh,
    -mw * .42,
    -mh * .9,
    -mw * .5,
    -mh * .2
  );

  ctx.bezierCurveTo(
    -mw * .42,
    mh * .65,
    -mw * .15,
    mh * .6,
    0,
    0
  );

  ctx.fill();

  /* right side */

  ctx.beginPath();

  ctx.moveTo(0, 0);

  ctx.bezierCurveTo(
    mw * .15,
    -mh,
    mw * .42,
    -mh * .9,
    mw * .5,
    -mh * .2
  );

  ctx.bezierCurveTo(
    mw * .42,
    mh * .65,
    mw * .15,
    mh * .6,
    0,
    0
  );

  ctx.fill();

  /* hair highlights */

  ctx.globalAlpha = .28;
  ctx.strokeStyle = "#b49a82";
  ctx.lineWidth = Math.max(1, width * .012);

  for (let i = -4; i <= 4; i++) {

    ctx.beginPath();

    ctx.moveTo(
      i * mw * .08,
      -mh * .15
    );

    ctx.lineTo(
      i * mw * .11,
      mh * .45
    );

    ctx.stroke();
  }

  ctx.restore();
}


/* ---------------------------------------------------
   REALISTIC BEARD
--------------------------------------------------- */

function drawBeard(lm, w, h) {

  const left = point(lm, 234, w, h);
  const right = point(lm, 454, w, h);
  const chin = point(lm, 152, w, h);

  const faceWidth = distance(left, right);
  const beardWidth = faceWidth * .88;

  const topY = chin.y - faceWidth * .48;
  const bottomY = chin.y + faceWidth * .18;

  const centreX = (left.x + right.x) / 2;

  ctx.save();

  ctx.translate(
    centreX,
    topY
  );

  const gradient = ctx.createLinearGradient(
    0,
    0,
    0,
    bottomY - topY
  );

  gradient.addColorStop(0, "rgba(35,25,20,.92)");
  gradient.addColorStop(.45, "rgba(25,18,15,.96)");
  gradient.addColorStop(1, "rgba(10,8,7,.98)");

  ctx.fillStyle = gradient;

  ctx.beginPath();

  ctx.moveTo(
    -beardWidth * .48,
    faceWidth * .08
  );

  ctx.bezierCurveTo(
    -beardWidth * .5,
    faceWidth * .32,
    -beardWidth * .42,
    faceWidth * .62,
    -beardWidth * .25,
    faceWidth * .78
  );

  ctx.bezierCurveTo(
    -beardWidth * .12,
    faceWidth * .9,
    0,
    faceWidth * .98,
    0,
    faceWidth * 1.02
  );

  ctx.bezierCurveTo(
    beardWidth * .12,
    faceWidth * .98,
    beardWidth * .25,
    faceWidth * .9,
    beardWidth * .32,
    faceWidth * .72
  );

  ctx.bezierCurveTo(
    beardWidth * .45,
    faceWidth * .48,
    beardWidth * .5,
    faceWidth * .25,
    beardWidth * .48,
    faceWidth * .08
  );

  ctx.closePath();

  ctx.fill();

  /* beard texture */

  ctx.globalAlpha = .28;
  ctx.strokeStyle = "#8d7461";
  ctx.lineWidth = Math.max(1, faceWidth * .009);

  for (let i = 0; i < 70; i++) {

    const x =
      (Math.random() - .5) *
      beardWidth * .85;

    const y =
      Math.random() *
      faceWidth * .82;

    ctx.beginPath();

    ctx.moveTo(x, y);

    ctx.lineTo(
      x + (Math.random() - .5) * 5,
      y + faceWidth * .06
    );

    ctx.stroke();
  }

  ctx.restore();
}


/* ---------------------------------------------------
   REALISTIC HAT
--------------------------------------------------- */

function drawHat(lm, w, h) {

  const left = point(lm, 127, w, h);
  const right = point(lm, 356, w, h);
  const forehead = point(lm, 10, w, h);

  const width = distance(left, right);

  const cx = (left.x + right.x) / 2;
  const cy = forehead.y - width * .42;

  ctx.save();

  ctx.translate(cx, cy);

  /* brim */

  const brimGradient = ctx.createLinearGradient(
    0,
    0,
    0,
    width * .16
  );

  brimGradient.addColorStop(0, "#171717");
  brimGradient.addColorStop(.5, "#050505");
  brimGradient.addColorStop(1, "#252525");

  ctx.fillStyle = brimGradient;

  ctx.beginPath();

  ctx.ellipse(
    0,
    width * .18,
    width * .62,
    width * .14,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();

  /* crown */

  const crownWidth = width * .68;
  const crownHeight = width * .55;

  const crownGradient = ctx.createLinearGradient(
    0,
    -crownHeight,
    0,
    0
  );

  crownGradient.addColorStop(0, "#353535");
  crownGradient.addColorStop(.35, "#111111");
  crownGradient.addColorStop(1, "#050505");

  ctx.fillStyle = crownGradient;

  roundedRect(
    ctx,
    -crownWidth / 2,
    -crownHeight,
    crownWidth,
    crownHeight * .9,
    width * .06
  );

  ctx.fill();

  /* hat band */

  ctx.fillStyle = "#8d111f";

  ctx.fillRect(
    -crownWidth / 2,
    -crownHeight * .25,
    crownWidth,
    crownHeight * .1
  );

  ctx.restore();
}


/* ---------------------------------------------------
   REALISTIC BIG EARS
--------------------------------------------------- */

function drawEars(lm, w, h) {

  const left = point(lm, 234, w, h);
  const right = point(lm, 454, w, h);

  const width = distance(left, right);
  const earH = width * .32;
  const earW = width * .16;

  ctx.save();

  const skin = ctx.createLinearGradient(
    0,
    -earH,
    0,
    earH
  );

  skin.addColorStop(0, "#d89478");
  skin.addColorStop(.5, "#b96f5c");
  skin.addColorStop(1, "#8d4d43");

  ctx.fillStyle = skin;

  /* left ear */

  ctx.beginPath();

  ctx.ellipse(
    left.x - earW * .45,
    left.y,
    earW,
    earH,
    -0.12,
    0,
    Math.PI * 2
  );

  ctx.fill();

  /* right ear */

  ctx.beginPath();

  ctx.ellipse(
    right.x + earW * .45,
    right.y,
    earW,
    earH,
    0.12,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.globalAlpha = .35;
  ctx.strokeStyle = "#633832";
  ctx.lineWidth = 3;

  ctx.beginPath();

  ctx.ellipse(
    left.x - earW * .45,
    left.y,
    earW * .55,
    earH * .65,
    -0.12,
    0,
    Math.PI * 2
  );

  ctx.stroke();

  ctx.beginPath();

  ctx.ellipse(
    right.x + earW * .45,
    right.y,
    earW * .55,
    earH * .65,
    0.12,
    0,
    Math.PI * 2
  );

  ctx.stroke();

  ctx.restore();
}


/* ---------------------------------------------------
   REALISTIC HAIR
--------------------------------------------------- */

function drawHair(lm, w, h) {

  const left = point(lm, 127, w, h);
  const right = point(lm, 356, w, h);
  const top = point(lm, 10, w, h);

  const width = distance(left, right);

  const cx = (left.x + right.x) / 2;

  ctx.save();

  ctx.fillStyle = "#211915";

  ctx.beginPath();

  ctx.moveTo(
    left.x - width * .05,
    top.y + width * .08
  );

  ctx.bezierCurveTo(
    left.x - width * .04,
    top.y - width * .2,
    cx - width * .3,
    top.y - width * .4,
    cx,
    top.y - width * .3
  );

  ctx.bezierCurveTo(
    cx + width * .3,
    top.y - width * .4,
    right.x + width * .04,
    top.y - width * .2,
    right.x + width * .05,
    top.y + width * .08
  );

  ctx.bezierCurveTo(
    right.x - width * .02,
    top.y - width * .02,
    left.x + width * .02,
    top.y - width * .02,
    left.x - width * .05,
    top.y + width * .08
  );

  ctx.fill();

  ctx.globalAlpha = .3;
  ctx.strokeStyle = "#9b765e";
  ctx.lineWidth = 2;

  for (let i = -5; i <= 5; i++) {

    ctx.beginPath();

    ctx.moveTo(
      cx + i * width * .05,
      top.y - width * .2
    );

    ctx.quadraticCurveTo(
      cx + i * width * .04,
      top.y - width * .3,
      cx + i * width * .03,
      top.y - width * .36
    );

    ctx.stroke();
  }

  ctx.restore();
}


/* ---------------------------------------------------
   GLASSES
--------------------------------------------------- */

function drawGlasses(lm, w, h) {

  const leftEye = point(lm, 33, w, h);
  const rightEye = point(lm, 263, w, h);

  const width = distance(leftEye, rightEye);
  const rot = angle(leftEye, rightEye);

  ctx.save();

  ctx.translate(
    (leftEye.x + rightEye.x) / 2,
    (leftEye.y + rightEye.y) / 2
  );

  ctx.rotate(rot);

  ctx.strokeStyle = "#111";
  ctx.lineWidth = Math.max(3, width * .025);

  ctx.fillStyle = "rgba(20,20,25,.45)";

  ctx.beginPath();
  ctx.roundRect(
    -width * .55,
    -width * .19,
    width * .42,
    width * .34,
    width * .08
  );
  ctx.fill();
  ctx.stroke();

  ctx.beginPath();
  ctx.roundRect(
    width * .13,
    -width * .19,
    width * .42,
    width * .34,
    width * .08
  );
  ctx.fill();
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(
    -width * .13,
    -width * .02
  );

  ctx.lineTo(
    width * .13,
    -width * .02
  );

  ctx.stroke();

  ctx.restore();
}


/* ---------------------------------------------------
   DRAW SELECTED EFFECT
--------------------------------------------------- */

function drawEffect(lm, w, h) {

  if (!lm) return;

  switch (currentEffect) {

    case "moustache":
      drawMoustache(lm, w, h);
      break;

    case "beard":
      drawBeard(lm, w, h);
      break;

    case "hat":
      drawHat(lm, w, h);
      break;

    case "ears":
      drawEars(lm, w, h);
      break;

    case "hair":
      drawHair(lm, w, h);
      break;

    case "glasses":
      drawGlasses(lm, w, h);
      break;
  }
}


/* ---------------------------------------------------
   COMMAND RECOGNITION
--------------------------------------------------- */

function chooseEffect(text) {

  const t = text.toLowerCase().trim();

  if (
    t.includes("moustache") ||
    t.includes("mustache") ||
    t.includes("mo") && t.includes("stache")
  ) {
    return "moustache";
  }

  if (
    t.includes("beard") ||
    t.includes("facial hair")
  ) {
    return "beard";
  }

  if (
    t.includes("hat") ||
    t.includes("top hat") ||
    t.includes("cap")
  ) {
    return "hat";
  }

  if (
    t.includes("ear") ||
    t.includes("ears")
  ) {
    return "ears";
  }

  if (
    t.includes("hair") ||
    t.includes("haircut") ||
    t.includes("long hair")
  ) {
    return "hair";
  }

  if (
    t.includes("glasses") ||
    t.includes("sunglasses")
  ) {
    return "glasses";
  }

  return currentEffect;
}


/* ---------------------------------------------------
   SET EFFECT
--------------------------------------------------- */

function setEffect(effect, customText = null) {

  currentEffect = effect;

  document
    .querySelectorAll(".chip")
    .forEach(chip => {

      chip.classList.toggle(
        "active",
        chip.dataset.effect === effect
      );

    });

  if (customText) {

    phrase.textContent = customText;

  } else {

    const names = {
      moustache: "Give them a huge realistic moustache",
      beard: "Give them a huge realistic beard",
      hat: "Put a realistic hat on them",
      ears: "Give them huge realistic ears",
      hair: "Give them realistic long hair",
      glasses: "Give them realistic sunglasses"
    };

    phrase.textContent = names[effect];

  }

  status.textContent =
    "✨ " +
    effect.charAt(0).toUpperCase() +
    effect.slice(1) +
    " selected";
}


/* ---------------------------------------------------
   BUTTONS
--------------------------------------------------- */

document
  .querySelectorAll(".chip")
  .forEach(chip => {

    chip.addEventListener("click", () => {

      setEffect(
        chip.dataset.effect
      );

    });

  });


transformButton.addEventListener("click", () => {

  const text = custom.value.trim();

  if (text) {

    const effect = chooseEffect(text);

    setEffect(
      effect,
      text
    );

  } else {

    setEffect(currentEffect);

  }

  status.textContent =
    "✨ Transformation active — move your face!";

});


startButton.addEventListener(
  "click",
  startCamera
);


custom.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {
      transformButton.click();
    }

  }
);


swapButton.addEventListener("click", () => {

  player =
    player === "A"
      ? "B"
      : "A";

  status.textContent =
    "↔ Player " +
    player +
    "'s turn";

});


laughButton.addEventListener("click", () => {

  status.textContent =
    "😂 POINT! Someone laughed!";

});


/* ---------------------------------------------------
   MAIN FACE TRACKING LOOP
--------------------------------------------------- */

function loop() {

  if (!running || !faceLandmarker) {
    requestAnimationFrame(loop);
    return;
  }

  if (
    video.readyState >= 2 &&
    video.currentTime !== lastVideoTime
  ) {

    lastVideoTime = video.currentTime;

    const results =
      faceLandmarker.detectForVideo(
        video,
        performance.now()
      );

    resizeCanvas();

    ctx.clearRect(
      0,
      0,
      video.clientWidth,
      video.clientHeight
    );

    if (
      results.faceLandmarks &&
      results.faceLandmarks.length
    ) {

      /*
       * Draw the selected effect on every
       * detected face.
       *
       * This means the effect moves with
       * the person's actual face.
       */

      for (
        const landmarks of results.faceLandmarks
      ) {

        drawEffect(
          landmarks,
          video.clientWidth,
          video.clientHeight
        );

      }

    }

  }

  requestAnimationFrame(loop);
}


/* ---------------------------------------------------
   RESIZE
--------------------------------------------------- */

window.addEventListener(
  "resize",
  resizeCanvas
);


/* ---------------------------------------------------
   START INITIAL SETUP
--------------------------------------------------- */

setEffect("beard");

</script>
