<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Make Me Laugh</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#070709;color:#fff;font-family:system-ui,-apple-system,sans-serif}
.app{width:min(480px,100%);margin:auto;padding:18px 12px}
.head{display:flex;justify-content:space-between;align-items:center;font-weight:900}
.logo{font-size:22px}.logo i{color:#ff315b;font-style:normal}.badge{border:1px solid #333;border-radius:20px;padding:9px;font-size:11px}
.cam{position:relative;aspect-ratio:9/16;background:#17171c;border-radius:25px;overflow:hidden;margin-top:15px}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
canvas{pointer-events:none}
.bar{position:absolute;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;z-index:5}
.pill{background:#050507;padding:10px 14px;border-radius:20px;font-size:12px;font-weight:800}
.turn{position:absolute;top:70px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#050507;padding:10px 16px;border-radius:20px;font-weight:800;font-size:12px}
.words{position:absolute;bottom:65px;left:15px;right:15px;text-align:center;z-index:5}
.words small{display:block;font-weight:800;letter-spacing:2px;color:#aaa}
#phrase{font-size:22px;font-weight:900}
.panel{margin-top:15px}.lab{font-size:15px;color:#aaa}
.chips{display:flex;gap:5px;overflow-x:auto;padding:6px 0}
.chip,.btn{border:0;border-radius:12px;padding:10px 13px;background:#29292f;color:#fff;font-weight:800;white-space:nowrap}
.chip.on{background:#ff315b}
input{width:100%;padding:13px;border-radius:12px;border:1px solid #444;background:#111;color:#fff}
.row{display:flex;gap:7px;margin-top:8px}.row>*{flex:1}
.go{background:#ff315b}.status{margin-top:10px;color:#aaa;text-align:center;font-size:12px}
.card{margin-top:12px;padding:15px;border-radius:18px;background:#141419;border:1px solid #29292f;font-size:12px}
</style>
</head>

<body>
<div class="app">
<div class="head"><div class="logo">MAKE ME <i>LAUGH</i> 😂</div><div class="badge">LIVE CAMERA</div></div>

<div class="cam">
<video id="video" autoplay muted playsinline></video>
<canvas id="overlay"></canvas>
<div class="bar"><div class="pill">ROUND <span id="round">1</span></div><div class="pill">A <span id="a">0</span> · B <span id="b">0</span></div></div>
<div class="turn" id="turn">A'S TURN — MAKE B LAUGH</div>
<div class="words"><small>AI TRANSFORMATION</small><span id="phrase">Give them a huge moustache</span></div>
</div>

<div class="panel">
<div class="lab">What do you want to do to them?</div>
<div class="chips">
<button class="chip on" data-fx="moustache" data-t="Give them a huge moustache">🥸 Moustache</button>
<button class="chip" data-fx="hat" data-t="Put a ridiculous red hat on them">🎩 Red hat</button>
<button class="chip" data-fx="ears" data-t="Give them massive ears">👂 Big ears</button>
<button class="chip" data-fx="beard" data-t="Give them a huge beard">🧔 Beard</button>
<button class="chip" data-fx="hair" data-t="Give them ridiculous hair">🦱 Hair</button>
</div>

<input id="custom" placeholder='Or type "Give Dad a massive beard"'>

<div class="row">
<button class="btn go" id="transform">✨ TRANSFORM</button>
<button class="btn" id="start">📷 START CAMERA</button>
</div>

<div class="row">
<button class="btn" id="swap">↔ SWAP</button>
<button class="btn" id="laugh">😂 THEY LAUGHED</button>
</div>

<div class="status" id="status">Press START CAMERA to begin.</div>

<div class="card"><strong>FIRST PERSON TO LAUGH LOSES</strong><br><br>
Make your opponent laugh by changing their face with ridiculous live effects.
</div>
</div>
</div>

<script type="module">
import{FaceLandmarker,FilesetResolver}from"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs";

const video=document.getElementById("video");
const canvas=document.getElementById("overlay");
const ctx=canvas.getContext("2d");
const status=document.getElementById("status");
const phrase=document.getElementById("phrase");
const custom=document.getElementById("custom");

let landmarker,stream,fx="moustache",player="A",round=1,A=0,B=0,active=false,last=-1;

async function startCamera(){
try{
status.textContent="Starting camera...";
const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm");
landmarker=await FaceLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"},runningMode:"VIDEO",numFaces:2});
stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});
video.srcObject=stream;
await video.play();
active=true;
resize();
status.textContent="📷 Camera live — make them laugh!";
requestAnimationFrame(loop);
}catch(e){
console.error(e);
status.textContent="Camera failed. Check browser camera permission.";
}
}

function resize(){
canvas.width=video.clientWidth*devicePixelRatio;
canvas.height=video.clientHeight*devicePixelRatio;
canvas.style.width=video.clientWidth+"px";
canvas.style.height=video.clientHeight+"px";
ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}

function point(lm,i,w,h){return{x:lm[i].x*w,y:lm[i].y*h}}

function emoji(t,x,y,s,r=0){
ctx.save();ctx.translate(x,y);ctx.rotate(r);
ctx.font=`${s}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`;
ctx.textAlign="center";ctx.textBaseline="middle";
ctx.fillText(t,0,0);ctx.restore();
}

function drawFace(lm,w,h){
const l=point(lm,234,w,h),r=point(lm,454,w,h),mouth=point(lm,13,w,h),chin=point(lm,152,w,h),fore=point(lm,10,w,h);
const fw=Math.hypot(r.x-l.x,r.y-l.y),ang=Math.atan2(r.y-l.y,r.x-l.x);
if(fx==="moustache")emoji("🥸",mouth.x,mouth.y+fw*.04,fw*.34,ang);
if(fx==="beard")emoji("🧔",chin.x,chin.y-fw*.16,fw*.48,ang);
if(fx==="hat")emoji("🎩",fore.x,fore.y-fw*.16,fw*.48,ang);
if(fx==="hair")emoji("🦱",fore.x,fore.y-fw*.05,fw*.52,ang);
if(fx==="ears"){emoji("👂",l.x-fw*.08,l.y,fw*.32,ang);emoji("👂",r.x+fw*.08,r.y,fw*.32,ang)}
}

function loop(){
if(!active)return;
const w=video.clientWidth,h=video.clientHeight;
if(video.currentTime!==last){
const result=landmarker.detectForVideo(video,performance.now());
ctx.clearRect(0,0,w,h);
(result.faceLandmarks||[]).forEach(f=>drawFace(f,w,h));
last=video.currentTime;
}
requestAnimationFrame(loop);
}

function choose(t){
t=t.toLowerCase();
if(t.includes("moust")||t.includes("mustache"))return"moustache";
if(t.includes("hat"))return"hat";
if(t.includes("ear"))return"ears";
if(t.includes("beard"))return"beard";
if(t.includes("hair"))return"hair";
return fx;
}

document.querySelectorAll(".chip").forEach(x=>x.onclick=()=>{
document.querySelectorAll(".chip").forEach(y=>y.classList.remove("on"));
x.classList.add("on");fx=x.dataset.fx;phrase.textContent=x.dataset.t;custom.value="";
});

document.getElementById("start").onclick=startCamera;

document.getElementById("transform").onclick=()=>{
if(custom.value.trim()){phrase.textContent=custom.value.trim();fx=choose(custom.value)}
status.textContent="✨ Transformation ready!";
};

document.getElementById("swap").onclick=()=>{
player=player==="A"?"B":"A";round++;
document.getElementById("round").textContent=round;
document.getElementById("turn").textContent=player+"'S TURN — MAKE "+(player==="A"?"B":"A")+" LAUGH";
};

document.getElementById("laugh").onclick=()=>{
if(player==="A"){A++;document.getElementById("a").textContent=A}
else{B++;document.getElementById("b").textContent=B}
status.textContent="😂 Point! Swap turns!";
};

window.addEventListener("resize",resize);
</script>
</body>
</html>
